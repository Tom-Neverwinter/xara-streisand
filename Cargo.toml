[workspace]
resolver = "3"
members = ["crates/xara-phy", "crates/xara-arq", "crates/xara-host", "crates/xara-ui", "crates/xara", "crates/xara-testkit"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/Tom-Neverwinter/xara-streisand"

[workspace.dependencies]
xara-phy = { path = "crates/xara-phy" }
xara-arq = { path = "crates/xara-arq" }
xara-host = { path = "crates/xara-host" }
xara-ui = { path = "crates/xara-ui" }
xara-testkit = { path = "crates/xara-testkit" }
num-complex = "0.4"
rustfft = "6.4"
miniz_oxide = "0.9"
libc = "0.2"
alsa-sys = "0.6.1"

[workspace.lints.rust]
# Enforce the edition-2024 default so a future edition change can't silently
# relax it: every unsafe op inside an unsafe fn needs its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 2
incremental = false
