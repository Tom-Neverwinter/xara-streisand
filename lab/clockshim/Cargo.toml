[package]
name = "clockshim"
version = "0.1.0"
edition = "2021"

[lib]
name = "clockshim"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "runat"
path = "src/bin/runat.rs"

[profile.release]
panic = "abort"
opt-level = "z"

# not part of the xara workspace: a 32-bit Windows lab tool
[workspace]
