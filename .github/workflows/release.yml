name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bins:
    uses: ./.github/workflows/bins.yml

  # bins.yml also builds the source tarball, so CI on main produces every sum the tag must carry.
  release:
    needs: [bins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: tag matches version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p;T;q' Cargo.toml)
          test "${GITHUB_REF_NAME#v}" = "$ver"
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum -- *.tar.xz *.buildinfo | LC_ALL=C sort -k2 > SHA256SUMS
      - name: sums match the tag
        run: |
          git fetch -q --depth=1 origin "+$GITHUB_REF:$GITHUB_REF"
          git for-each-ref --format='%(contents)' "$GITHUB_REF" | grep -E '^[0-9a-f]{64}  xara-' > tag-sums
          diff tag-sums out/SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.tar.xz
            out/*.buildinfo
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v h="## $ver" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "xara $ver" --notes-file notes.md out/*

  # Windows binaries are not byte-reproducible, so they stay out of the tag's SHA256SUMS: built after the
  # draft release exists, attested on their own and uploaded next to the Linux tarballs with their own sum.
  windows:
    needs: [release]
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: cargo build --locked --release -p xara
      - name: package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "xara-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "out\$name" | Out-Null
          Copy-Item target\release\xara.exe, target\release\xara-monitor.exe, target\release\xara-keygen.exe, LICENSE, README.md, BUILDING.md "out\$name\"
          Copy-Item -Recurse dist "out\$name\dist"
          Compress-Archive -Path "out\$name" -DestinationPath "out\$name.zip"
          $h = (Get-FileHash -Algorithm SHA256 "out\$name.zip").Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "out\$name.zip.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*.zip
      - name: upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem out\*.zip, out\*.zip.sha256)

  # The Android APK is not byte-reproducible either: built after the draft release exists, uploaded with its own sum.
  apk:
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: >-
          rustup toolchain install "$RUST" --profile minimal
          --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: build the APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          RUSTUP_TOOLCHAIN="$RUST" python3 android/build_apk.py --pat
          name="xara-${GITHUB_REF_NAME#v}-android.apk"
          mkdir out && cp target/android/xara.apk "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*.apk
      - name: upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*
