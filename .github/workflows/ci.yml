name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev libasound2-dev
      - run: rustup toolchain install "$RUST" --profile minimal --component rustfmt,clippy
      - run: cargo +"$RUST" fmt --all --check
      # main.rs include!s tnc_main.rs, and cargo fmt only follows `mod`.
      - run: rustfmt +"$RUST" --edition 2024 --check crates/xara/src/tnc_main.rs
      - run: cargo +"$RUST" clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +"$RUST" clippy --locked -p xara --all-targets --no-default-features --features pulse -- -D warnings
      - run: cargo +"$RUST" clippy --locked -p xara --all-targets --no-default-features --features alsa -- -D warnings
      - run: cargo +"$RUST" test --locked --release --workspace
      - run: cargo +"$RUST" test --locked --release -p xara-phy --features fixed-turbo

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev libasound2-dev
      - run: rustup toolchain install "$RUST" --profile minimal --component clippy
      - run: cargo +"$RUST" clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +"$RUST" test --locked --release --workspace
      - run: cargo +"$RUST" test --locked --release -p xara-phy --features float-turbo

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUST" --profile minimal --component clippy
      - run: cargo +"$RUST" clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +"$RUST" test --locked --release --workspace

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$env:RUST" --profile minimal --component clippy
      - run: cargo +"$env:RUST" clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +"$env:RUST" test --locked --release --workspace

  freebsd:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: rustup toolchain install "$RUST" --profile minimal --component clippy --target x86_64-unknown-freebsd
      - run: cargo +"$RUST" clippy --locked --workspace --all-targets --target x86_64-unknown-freebsd -- -D warnings

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: >-
          rustup toolchain install "$RUST" --profile minimal
          --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The headless modem (KISS/TCP TNC + web UI, no local audio) must keep
      # compiling for Android. `check` does not link, so no NDK is needed here.
      - name: headless modem compiles for Android
        run: |
          for t in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo +"$RUST" check --locked --no-default-features -p xara -p xara-ui --target "$t"
          done
      # A linked arm64 build with AAudio, against the NDK the runner image ships (API 26: AAudio's minimum).
      - name: linked arm64 build (NDK, AAudio)
        run: |
          # ANDROID_NDK_LATEST_HOME is a runner shell variable, not a workflow env one
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cc="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$cc"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$cc" cargo +"$RUST" build --locked --release --no-default-features -p xara --target aarch64-linux-android
          file target/aarch64-linux-android/release/xara
      - uses: actions/upload-artifact@v7
        with:
          name: xara-aarch64-linux-android
          path: |
            target/aarch64-linux-android/release/xara
            target/aarch64-linux-android/release/xara-monitor

  # The Android app: modem + Pat for arm64, armv7 and x86_64, built with the SDK's own tools (android/build_apk.py),
  # debug-signed. Its command-line rules run on the JVM first (android/test/CommandsTest.java).
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: >-
          rustup toolchain install "$RUST" --profile minimal
          --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: build the APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          RUSTUP_TOOLCHAIN="$RUST" python3 android/build_apk.py --pat
      - uses: actions/upload-artifact@v7
        with:
          name: xara-android-apk
          path: target/android/xara.apk

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev libasound2-dev
      - run: >-
          rustup toolchain install 1.85.0 --profile minimal
          --target x86_64-unknown-freebsd,aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo +1.85.0 build --locked --release --workspace --all-targets
      - name: check other OSes
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          for t in x86_64-unknown-freebsd aarch64-apple-darwin x86_64-apple-darwin; do
            cargo +1.85.0 check --locked --workspace --all-targets --target "$t"
          done

  arm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7-unknown-linux-musleabihf, runner: qemu-arm, turbo: default }
          - { target: armv7-unknown-linux-musleabihf, runner: qemu-arm, turbo: float-turbo }
          - { target: arm-unknown-linux-musleabihf, runner: qemu-arm -cpu arm1176, turbo: default }
          - { target: arm-unknown-linux-musleabihf, runner: qemu-arm -cpu arm1176, turbo: float-turbo }
    steps:
      - uses: actions/checkout@v7
      - run: echo "RUST=$(cat .rust-version)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - run: rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.target }}
      - name: test under qemu
        shell: bash
        run: |
          t=$(echo '${{ matrix.target }}' | tr a-z- A-Z_)
          export CARGO_TARGET_${t}_LINKER=rust-lld
          export CARGO_TARGET_${t}_RUSTFLAGS='-C link-self-contained=yes -C linker-flavor=ld.lld'
          export CARGO_TARGET_${t}_RUNNER='${{ matrix.runner }}'
          features=()
          if [ '${{ matrix.turbo }}' != default ]; then features=(--features 'xara-phy/${{ matrix.turbo }}'); fi
          cargo +"$RUST" test --locked --release --target ${{ matrix.target }} \
            -p xara-phy -p xara-arq -p xara-host "${features[@]}"

  bins:
    uses: ./.github/workflows/bins.yml
